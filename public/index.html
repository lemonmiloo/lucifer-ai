<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Lucifer AI</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111522;--line:#252b3b;--muted:#929bb0;--accent:#9b78ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17132b 0,#090b12 48%);color:#f4f3fb;font:15px Inter,system-ui,Arial,sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:22px}.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:8px 0 18px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#5b38c9);display:grid;place-items:center;font-weight:900;font-size:20px}.brand{font-size:18px;font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}.status{margin-left:auto;color:#8ee3b1;font-size:12px}.chat{flex:1;padding:26px 0;display:flex;flex-direction:column;gap:18px}.welcome{text-align:center;margin:auto;max-width:560px;padding:35px 10px}.welcome h1{font-size:clamp(28px,6vw,42px);margin:0 0 10px}.welcome p{color:var(--muted);line-height:1.6}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.chip{border:1px solid var(--line);background:#141827;color:#d8d3ee;border-radius:12px;padding:10px 13px;cursor:pointer}.msg{max-width:85%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#28213f}.assistant{align-self:flex-start;background:var(--panel)}pre{background:#080a10;border:1px solid var(--line);border-radius:10px;padding:13px;overflow:auto;white-space:pre}.composer{position:sticky;bottom:0;background:linear-gradient(transparent,#090b12 22%);padding:18px 0 8px}.form{display:flex;gap:10px;background:#111522;border:1px solid #333047;border-radius:16px;padding:9px}.form textarea{flex:1;resize:none;min-height:44px;max-height:160px;background:transparent;color:white;border:0;outline:0;padding:11px;font:inherit}.send{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}.send:disabled{opacity:.5}.foot{text-align:center;color:#747d91;font-size:11px;margin-top:10px}@media(max-width:600px){.app{padding:14px}.msg{max-width:94%}.welcome{padding:24px 0}.chips{flex-direction:column}.chip{width:100%}}

.history-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#141827;color:#eee;font-size:21px;cursor:pointer;display:grid;place-items:center}.drawer-backdrop{position:fixed;inset:0;background:#0009;z-index:10;opacity:0;pointer-events:none;transition:.2s}.drawer-backdrop.open{opacity:1;pointer-events:auto}.drawer{position:fixed;z-index:11;inset:0 auto 0 0;width:min(330px,86vw);background:#101421;border-right:1px solid var(--line);padding:18px;transform:translateX(-105%);transition:.22s;display:flex;flex-direction:column;gap:14px}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;font-weight:750;font-size:17px}.drawer-actions{display:flex;gap:8px}.drawer-btn{border:1px solid var(--line);background:#1a2030;color:#eee;border-radius:10px;padding:10px 12px;cursor:pointer}.history-list{overflow:auto;display:flex;flex-direction:column;gap:7px}.history-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:#171d2b;color:#e8e6f0;border-radius:10px;padding:11px;cursor:pointer}.history-item.active{border-color:var(--accent);background:#242039}.history-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}.history-delete{border:0;background:transparent;color:#929bb0;font-size:17px;cursor:pointer;padding:2px 5px}.history-empty{color:var(--muted);font-size:13px;line-height:1.5;padding:12px 4px}.top{gap:10px}

.msg{white-space:normal;max-width:88%;padding:15px 17px}.assistant{width:min(100%,760px)}.message-content{overflow-wrap:anywhere;line-height:1.75}.message-content p{margin:0 0 12px}.message-content p:last-child{margin-bottom:0}.message-content h1,.message-content h2,.message-content h3{line-height:1.3;margin:18px 0 9px}.message-content h1{font-size:1.25em}.message-content h2{font-size:1.13em}.message-content h3{font-size:1.04em}.message-content ul,.message-content ol{padding-left:23px;margin:8px 0 14px}.message-content li{margin:5px 0}.message-content blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:4px 12px;color:#c6c1d6}.message-content code.inline-code{background:#080a10;border:1px solid var(--line);border-radius:5px;padding:2px 6px;font: .9em ui-monospace,monospace;color:#d8caff}.code-wrap{margin:13px 0 15px;border:1px solid #343044;border-radius:12px;overflow:hidden;background:#080a10}.code-head{height:38px;padding:0 10px 0 13px;display:flex;align-items:center;justify-content:space-between;background:#171827;border-bottom:1px solid #343044;color:#a9a4b9;font-size:11px}.copy-code{border:1px solid #454057;background:#242236;color:#eee;border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer}.copy-code:hover{background:#35304d}.code-wrap pre{margin:0;border:0;border-radius:0;padding:14px;max-height:480px;overflow:auto;white-space:pre;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#e2ddf5}.assistant .message-content> :first-child{margin-top:0}.assistant .message-content> :last-child{margin-bottom:0}@media(max-width:600px){.msg{max-width:98%;padding:13px}.assistant{width:100%}.code-wrap pre{font-size:12px}}
.new-chat-float{position:fixed;z-index:5;left:22px;bottom:112px;display:flex;align-items:center;gap:8px;padding:12px 15px;border:1px solid #494064;border-radius:14px;background:#211b35;color:#f4f0ff;font:600 13px Inter,system-ui,sans-serif;box-shadow:0 8px 28px #0008;cursor:pointer;transition:background .18s,transform .18s}.new-chat-float:hover{background:#30264b;transform:translateY(-2px)}.new-chat-float .plus{font-size:19px;line-height:1;color:#c4adff}@media(max-width:600px){.new-chat-float{left:14px;bottom:112px;padding:11px 13px;border-radius:13px}}\n</style></head><body><main class="app"><div class="drawer-backdrop" id="drawerBackdrop"></div><aside class="drawer" id="historyDrawer"><div class="drawer-head"><span>Riwayat Chat</span><button class="drawer-btn" id="closeDrawer" aria-label="Tutup">✕</button></div><div class="drawer-actions"><button class="drawer-btn" id="newChat">＋ Chat Baru</button></div><div class="history-list" id="historyList"></div></aside><header class="top"><button class="history-btn" id="historyToggle" aria-label="Buka riwayat chat">☰</button><div class="logo">L</div><div><div class="brand">Lucifer AI</div><div class="sub">Lua Coding Assistant · Powered by DeepSeek</div></div><div class="status">● Online</div></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>Build with Lucifer AI</h1><p>Asisten Lua untuk memahami dokumentasi, membuat contoh kode, dan membantu debugging.</p><div class="chips"><button class="chip" data-prompt="Jelaskan struktur dasar script Lua.">Jelaskan dasar Lua</button><button class="chip" data-prompt="Jelaskan fungsi getBot() berdasarkan dokumentasi Lucifer.">Pelajari Lucifer API</button><button class="chip" data-prompt="Bantu saya memahami error pada kode Lua ini: ">Bantu debugging</button></div></div></section><footer class="composer"><form class="form" id="form"><textarea id="input" placeholder="Tulis pertanyaan Lua kamu..." rows="1"></textarea><button class="send" id="send">Kirim</button></form><div class="foot">Percakapan dapat disimpan untuk pengelolaan layanan. Jangan masukkan password, token, atau API key.</div></footer></main>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),form=document.getElementById("form"),send=document.getElementById("send");
const drawer=document.getElementById("historyDrawer"),backdrop=document.getElementById("drawerBackdrop"),historyList=document.getElementById("historyList");
const STORAGE_KEY="lucifer-ai-chat-history-v1";
const VISITOR_KEY="lucifer-ai-visitor-v1";
let visitorId=localStorage.getItem(VISITOR_KEY);if(!visitorId){visitorId=crypto.randomUUID();localStorage.setItem(VISITOR_KEY,visitorId)}
let chats=[],currentChatId=null,history=[];
function loadChats(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");chats=Array.isArray(saved)?saved.filter(c=>c&&c.id&&Array.isArray(c.messages)):[]}catch{chats=[]}}
function saveChats(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(chats))}catch{console.warn("Penyimpanan riwayat penuh atau tidak tersedia.")}}
function currentChat(){return chats.find(c=>c.id===currentChatId)}
function openDrawer(){drawer.classList.add("open");backdrop.classList.add("open");renderHistory()}
function closeDrawer(){drawer.classList.remove("open");backdrop.classList.remove("open")}
document.getElementById("historyToggle").addEventListener("click",openDrawer);
document.getElementById("closeDrawer").addEventListener("click",closeDrawer);
backdrop.addEventListener("click",closeDrawer);
function renderHistory(){
 historyList.replaceChildren();
 if(!chats.length){const empty=document.createElement("div");empty.className="history-empty";empty.textContent="Belum ada percakapan. Mulai chat baru untuk menyimpan riwayat.";historyList.appendChild(empty);return}
 [...chats].sort((a,b)=>b.updatedAt-a.updatedAt).forEach(c=>{
  const row=document.createElement("div");row.className="history-item"+(c.id===currentChatId?" active":"");
  const title=document.createElement("span");title.className="history-title";title.textContent=c.title||"Chat baru";
  const del=document.createElement("button");del.className="history-delete";del.textContent="×";del.title="Hapus chat";
  row.append(title,del);title.addEventListener("click",()=>openChat(c.id));row.addEventListener("click",e=>{if(e.target!==del)openChat(c.id)});
  del.addEventListener("click",e=>{e.stopPropagation();if(!confirm("Hapus percakapan ini?"))return;chats=chats.filter(x=>x.id!==c.id);if(currentChatId===c.id){currentChatId=null;history=[];renderMessages([])}saveChats();renderHistory()});
  historyList.appendChild(row);
 });
}
function renderMessages(messages){
 chat.replaceChildren();
 const welcome=document.createElement("div");welcome.className="welcome";welcome.id="welcome";
 welcome.innerHTML='<h1>Build with Lucifer AI</h1><p>Asisten Lua untuk memahami dokumentasi, membuat contoh kode, dan membantu debugging.</p><div class="chips"><button class="chip" data-prompt="Jelaskan struktur dasar script Lua.">Jelaskan dasar Lua</button><button class="chip" data-prompt="Jelaskan fungsi getBot() berdasarkan dokumentasi Lucifer.">Pelajari Lucifer API</button><button class="chip" data-prompt="Bantu saya memahami error pada kode Lua ini: ">Bantu debugging</button></div>';
 chat.appendChild(welcome);
 welcome.querySelectorAll("[data-prompt]").forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.prompt;input.focus()}));
 messages.forEach(m=>add(m.content,m.role,false));
}
function openChat(id){const c=chats.find(x=>x.id===id);if(!c)return;currentChatId=id;history=c.messages.filter(m=>m.role==="user"||m.role==="assistant").map(m=>({role:m.role,content:m.content}));renderMessages(c.messages);closeDrawer();renderHistory()}
function newChat(){currentChatId=null;history=[];renderMessages([]);closeDrawer();renderHistory();input.focus()}
document.getElementById("newChat").addEventListener("click",newChat);\ndocument.getElementById("floatingNewChat").addEventListener("click",newChat);
function appendInline(parent,text){
 const pattern=/(`[^`]+`|\*\*[^*]+\*\*|__[^_]+__|\*[^*]+\*)/g;let last=0,match;
 while((match=pattern.exec(text))){if(match.index>last)parent.appendChild(document.createTextNode(text.slice(last,match.index)));const token=match[0];let node;
  if(token.startsWith("`")){node=document.createElement("code");node.className="inline-code";node.textContent=token.slice(1,-1)}
  else{node=document.createElement(token.startsWith("**")||token.startsWith("__")?"strong":"em");node.textContent=token.startsWith("**")||token.startsWith("__")?token.slice(2,-2):token.slice(1,-1)}
  parent.appendChild(node);last=pattern.lastIndex;
 }
 if(last<text.length)parent.appendChild(document.createTextNode(text.slice(last)));
}
function renderContent(container,text){
 container.replaceChildren();const lines=String(text??"").replace(/\r/g,"").split("\n");let i=0;
 while(i<lines.length){const line=lines[i];
  if(/^\s*```/.test(line)){const lang=line.replace(/^\s*```/,"").trim()||"Code";const code=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i]))code.push(lines[i++]);if(i<lines.length)i++;
   const wrap=document.createElement("div");wrap.className="code-wrap";const head=document.createElement("div");head.className="code-head";const label=document.createElement("span");label.textContent=lang;const copy=document.createElement("button");copy.className="copy-code";copy.textContent="Copy";copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(code.join("\n"));copy.textContent="Tersalin ✓"}catch{copy.textContent="Gagal menyalin"}setTimeout(()=>copy.textContent="Copy",1600)});head.append(label,copy);const pre=document.createElement("pre");const codeEl=document.createElement("code");codeEl.textContent=code.join("\n");pre.appendChild(codeEl);wrap.append(head,pre);container.appendChild(wrap);continue;
  }
  if(!line.trim()){i++;continue}
  const heading=line.match(/^(#{1,3})\s+(.+)$/);if(heading){const h=document.createElement("h"+heading[1].length);appendInline(h,heading[2]);container.appendChild(h);i++;continue}
  if(/^\s*[-*+]\s+/.test(line)){const list=document.createElement("ul");while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){const li=document.createElement("li");appendInline(li,lines[i++].replace(/^\s*[-*+]\s+/,""));list.appendChild(li)}container.appendChild(list);continue}
  if(/^\s*\d+[.)]\s+/.test(line)){const list=document.createElement("ol");while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){const li=document.createElement("li");appendInline(li,lines[i++].replace(/^\s*\d+[.)]\s+/,""));list.appendChild(li)}container.appendChild(list);continue}
  if(/^>\s?/.test(line)){const quote=document.createElement("blockquote");while(i<lines.length&&/^>\s?/.test(lines[i])){const p=document.createElement("p");appendInline(p,lines[i++].replace(/^>\s?/,""));quote.appendChild(p)}container.appendChild(quote);continue}
  const p=document.createElement("p");while(i<lines.length&&lines[i].trim()&&!/^\s*```/.test(lines[i])&&!/^#{1,3}\s+/.test(lines[i])&&!/^\s*[-*+]\s+/.test(lines[i])&&!/^\s*\d+[.)]\s+/.test(lines[i])&&!/^>\s?/.test(lines[i])){if(p.childNodes.length)p.appendChild(document.createElement("br"));appendInline(p,lines[i++])}container.appendChild(p);
 }
}
function add(text,role,persist=true){
 const w=document.getElementById("welcome");if(w)w.remove();const el=document.createElement("div");el.className="msg "+role;const content=document.createElement("div");content.className="message-content";renderContent(content,text);el.appendChild(content);chat.appendChild(el);el.scrollIntoView({behavior:"smooth",block:"end"});
 if(persist){let c=currentChat();if(!c){c={id:String(Date.now())+Math.random().toString(36).slice(2,7),serverId:crypto.randomUUID(),title:String(text).slice(0,42)||"Chat baru",messages:[],updatedAt:Date.now()};chats.push(c);currentChatId=c.id}c.messages.push({role,content:String(text??"")});c.updatedAt=Date.now();saveChats();renderHistory()}
 return el;
}
function updateLastMessage(el,text){const content=el.querySelector(".message-content");if(content)renderContent(content,text);const c=currentChat();if(c){const last=c.messages[c.messages.length-1];if(last)last.content=String(text??"");c.updatedAt=Date.now();saveChats();renderHistory()}}
loadChats();renderHistory();
form.addEventListener("submit",async e=>{
 e.preventDefault();const message=input.value.trim();if(!message)return;input.value="";add(message,"user");send.disabled=true;send.textContent="...";
 const wait=add("Lucifer sedang berpikir...","assistant");try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history,visitorId,conversationId:(currentChat()?.serverId||(currentChat().serverId=crypto.randomUUID()))})});
  const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw new Error(raw.trim().startsWith("<")||raw.startsWith("An error")?"Server sedang bermasalah atau timeout. Coba lagi sebentar.":"Respons server tidak valid: "+raw.slice(0,180))}
  if(!r.ok)throw new Error(data.error||"Permintaan gagal");if(typeof data.reply!=="string")throw new Error("Server tidak mengirim jawaban teks.");
  updateLastMessage(wait,data.reply);history.push({role:"user",content:message},{role:"assistant",content:data.reply});history=history.slice(-8);
 }catch(err){updateLastMessage(wait,"Error: "+err.message)}finally{send.disabled=false;send.textContent="Kirim";input.focus()}
});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script></body></html>
