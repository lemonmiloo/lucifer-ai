<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Lucifer AI</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111522;--line:#252b3b;--muted:#929bb0;--accent:#9b78ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17132b 0,#090b12 48%);color:#f4f3fb;font:15px Inter,system-ui,Arial,sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:22px}.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:8px 0 18px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#5b38c9);display:grid;place-items:center;font-weight:900;font-size:20px}.brand{font-size:18px;font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}.status{margin-left:auto;color:#8ee3b1;font-size:12px}.chat{flex:1;padding:26px 0;display:flex;flex-direction:column;gap:18px}.welcome{text-align:center;margin:auto;max-width:560px;padding:35px 10px}.welcome h1{font-size:clamp(28px,6vw,42px);margin:0 0 10px}.welcome p{color:var(--muted);line-height:1.6}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.chip{border:1px solid var(--line);background:#141827;color:#d8d3ee;border-radius:12px;padding:10px 13px;cursor:pointer}.msg{max-width:85%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#28213f}.assistant{align-self:flex-start;background:var(--panel)}pre{background:#080a10;border:1px solid var(--line);border-radius:10px;padding:13px;overflow:auto;white-space:pre}.composer{position:sticky;bottom:0;background:linear-gradient(transparent,#090b12 22%);padding:18px 0 8px}.form{display:flex;gap:10px;background:#111522;border:1px solid #333047;border-radius:16px;padding:9px}.form textarea{flex:1;resize:none;min-height:44px;max-height:160px;background:transparent;color:white;border:0;outline:0;padding:11px;font:inherit}.send{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}.send:disabled{opacity:.5}.foot{text-align:center;color:#747d91;font-size:11px;margin-top:10px}@media(max-width:600px){.app{padding:14px}.msg{max-width:94%}.welcome{padding:24px 0}.chips{flex-direction:column}.chip{width:100%}}
</style></head><body><main class="app"><header class="top"><div class="logo">L</div><div><div class="brand">Lucifer AI</div><div class="sub">Lua Coding Assistant · Powered by DeepSeek</div></div><div class="status">● Online</div></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>Build with Lucifer AI</h1><p>Asisten Lua untuk memahami dokumentasi, membuat contoh kode, dan membantu debugging.</p><div class="chips"><button class="chip" data-prompt="Jelaskan struktur dasar script Lua.">Jelaskan dasar Lua</button><button class="chip" data-prompt="Jelaskan fungsi getBot() berdasarkan dokumentasi Lucifer.">Pelajari Lucifer API</button><button class="chip" data-prompt="Bantu saya memahami error pada kode Lua ini: ">Bantu debugging</button></div></div></section><footer class="composer"><form class="form" id="form"><textarea id="input" placeholder="Tulis pertanyaan Lua kamu..." rows="1"></textarea><button class="send" id="send">Kirim</button></form><div class="foot">Jangan masukkan password, token, atau API key ke dalam chat.</div></footer></main>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),form=document.getElementById("form"),send=document.getElementById("send");let history=[];
function add(text,role){const w=document.getElementById("welcome");if(w)w.remove();const el=document.createElement("div");el.className="msg "+role;el.textContent=String(text??"");chat.appendChild(el);el.scrollIntoView({behavior:"smooth",block:"end"});return el}
document.querySelectorAll("[data-prompt]").forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.prompt;input.focus()}));
form.addEventListener("submit",async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;input.value="";add(message,"user");send.disabled=true;send.textContent="...";const wait=add("Lucifer sedang berpikir...","assistant");try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history})});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw new Error(raw.trim().startsWith("<")||raw.startsWith("An error")?"Server sedang bermasalah atau timeout. Coba lagi sebentar.": "Respons server tidak valid: "+raw.slice(0,180))}if(!r.ok)throw new Error(data.error||"Permintaan gagal");if(typeof data.reply!=="string")throw new Error("Server tidak mengirim jawaban teks.");wait.textContent=data.reply;history.push({role:"user",content:message},{role:"assistant",content:data.reply});history=history.slice(-8)}catch(err){wait.textContent="Error: "+err.message}finally{send.disabled=false;send.textContent="Kirim";input.focus()}});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script></body></html>
